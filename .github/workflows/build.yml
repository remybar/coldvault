name: Builds natifs non signés

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
          python-version: '3.12'
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --extra gui --group build --group dev
      - run: uv run --extra gui --group build pytest -q
      - run: uv run --extra gui --group build pyinstaller --noconfirm ColdVault.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ColdVault-unsigned-${{ matrix.os }}
          path: dist/
          retention-days: 7
