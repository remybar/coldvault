[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldvault"
version = "0.1.0"
description = "Archives froides portables, vérifiées par SHA-256"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]

[project.scripts]
coldvault = "coldvault.cli:main"
coldvault-gui = "coldvault.gui:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.12,<7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
